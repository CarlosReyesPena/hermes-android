name: Build APK / Release Gate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and verify APK
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release identity and upgrade versionCode
        env:
          MINIMUM_INSTALLED_VERSION_CODE: '2126'
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          match = re.search(
              r"^version:\s*([^\s+]+)\+(\d+)\s*$",
              pathlib.Path("pubspec.yaml").read_text(),
              re.M,
          )
          if not match:
              raise SystemExit("pubspec.yaml must declare versionName+versionCode")

          version_name, version_code_text = match.groups()
          version_code = int(version_code_text)
          minimum = int(os.environ["MINIMUM_INSTALLED_VERSION_CODE"])
          if version_code <= minimum:
              raise SystemExit(
                  f"versionCode {version_code} must be greater than {minimum}"
              )

          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              expected_tag = f"v{version_name}"
              actual_tag = os.environ.get("GITHUB_REF_NAME")
              if actual_tag != expected_tag:
                  raise SystemExit(
                      f"Release tag {actual_tag} does not match {expected_tag}"
                  )

          print(f"Verified {version_name}+{version_code}; upgrade floor is {minimum}")
          PY

      - name: Refuse an unsigned tagged release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_KEYSTORE != 'true'
        run: |
          echo "A tagged release requires the authorized release keystore."
          exit 1

      - name: Set up release keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "storePassword=$STORE_PASSWORD" > key.properties
          echo "keyPassword=$KEY_PASSWORD" >> key.properties
          echo "keyAlias=$KEY_ALIAS" >> key.properties
          echo "storeFile=${{ github.workspace }}/release.keystore" >> key.properties

      - name: Static analysis
        run: flutter analyze --no-pub --fatal-infos

      - name: Run tests
        run: flutter test --no-pub

      - name: Build APK (signed release)
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: flutter build apk --release --split-per-abi

      - name: Build APK (debug validation artifact only)
        if: env.HAS_RELEASE_KEYSTORE != 'true'
        run: flutter build apk --debug --split-per-abi

      - name: Upload signed release APKs
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      - name: Upload debug validation APKs
        if: env.HAS_RELEASE_KEYSTORE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-validation-apks
          path: build/app/outputs/flutter-apk/app-*-debug.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Hermes Android ${{ github.ref_name }}" \
            --generate-notes \
            build/app/outputs/flutter-apk/app-*-release.apk || \
          gh release upload "${{ github.ref_name }}" \
            build/app/outputs/flutter-apk/app-*-release.apk --clobber
