AutoName: Hermes Android
Summary: Chat with your Hermes AI agent from your phone
Description: |
  Hermes Android connects to a Hermes Agent Gateway API Server
  over LAN, Wi-Fi, or a private Tailscale network. It provides a
  full chat experience with streaming responses, session browsing,
  per-chat model selection, voice dictation, and multi-attachment
  uploads.

  Requires a running Hermes Agent gateway accessible from the
  device. No cloud account needed — you own the server.

RepoType: git
Repo: https://github.com/rusty4444/hermes-android

Builds:
  - versionName: '2.0.1'
    versionCode: 2131
    commit: v2.0.1
    sudo:
      - apt-get update
      - apt-get install -y ninja-build libgtk-3-dev
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@3.44.0
    prebuild:
      - export PATH=$$flutter$$/bin:$$PATH$$
      - flutter config --no-analytics
      - flutter pub get
    build:
      - export PATH=$$flutter$$/bin:$$PATH$$
      - flutter build apk --release
    scanignore:
      - build/app/intermediates
      - .dart_tool
      - pubspec.lock

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: '2.0.1'
CurrentVersionCode: 2131
